services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations

    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --queues=default,priority
    env_file:
      - ../.env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info --scheduler=celery.beat:PersistentScheduler
    env_file:
      - ../.env
    volumes:
      - ./backend/app:/app/app
      - celery_beat_data:/app/celerybeat-schedule
    depends_on:
      - db
      - redis
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  celery-flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    env_file:
      - ../.env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python /app/run_migrations.py
    env_file:
      - ../.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/run_migrations.py:/app/run_migrations.py
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy

  data-ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      bash -c "echo 'DEBUG: Listing data directories...' &&  ls -la /app/data/pipeline &&  ls -la /app/data/pipeline/2_staging_data &&  ls -la /app/data/static_assets &&  echo 'Running ingestion' &&  python /app/data/pipeline/run_data_ingestion.py"
    env_file:
      - ../.env
    volumes:
      - ./backend/app:/app/app
      - ../data:/app/data
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
